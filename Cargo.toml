[package]
name = "creampaper"
version = "0.1.0"
edition = "2021"
description = "Wallpapers animados para Windows, construido con CreamUI"
license = "Apache-2.0"

[dependencies]
# Pinned to a CreamUI revision that ships `AppHandle::spawn_stream` (not yet on crates.io).
creamui = { git = "https://github.com/sammwyy/creamui", rev = "bf5200e25807962dee04b99d46681b26844f7f8d", features = ["jsx", "image"] }
creamui-image = { git = "https://github.com/sammwyy/creamui", rev = "bf5200e25807962dee04b99d46681b26844f7f8d", features = ["svg"] }
log = "0.4"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
